map_hash_bucket_size 128;

map $http_authorization $mission_probe_authorized {
    default 0;
    "Bearer ${MISSION_SYNTHETIC_PROBE_TOKEN}" 1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 운영 실측(2026-09-17): 5.97 MB main.dart.js 가 무압축·무캐시로 내려갔다. 이미지가 빌드 시
    # 사전 압축한 .gz 를 그대로 서빙하고(CPU 비용 없음), 모든 응답은 ETag 재검증으로 돈다.
    gzip_static on;
    gzip_vary on;
    etag on;

    set $mission_release_ready "${MISSION_RELEASE_READY}";
    set $mission_release_id "${MISSION_RELEASE_ID}";
    set $mission_candidate_spec_sha256 "${MISSION_CANDIDATE_SPEC_SHA256}";
    set $mission_image_digest "${MISSION_IMAGE_DIGEST}";

    location = /internal/release/ready {
        if ($mission_probe_authorized = 0) {
            return 401;
        }
        if ($mission_release_ready != "true") {
            return 503;
        }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '{"release_id":"$mission_release_id","candidate_spec_sha256":"$mission_candidate_spec_sha256","image_digest":"$mission_image_digest","status":"ready"}';
    }

    location / {
        # 파일명이 내용 해시가 아니므로 장기 캐시는 배포 뒤 낡은 번들을 남긴다. no-cache 는
        # 매번 ETag 로 재검증(304)해 최신을 보장하면서 재다운로드는 피한다.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
