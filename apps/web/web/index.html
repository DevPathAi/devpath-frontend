<html lang="ko">

  <meta charset="UTF-8">

  <meta name="description" content="적응형 진단 결과에서 시작하는 맞춤 학습 로드맵과, 학습 맥락을 아는 AI 멘토를 제공하는 Leva 앱입니다.">

  <!-- 본문이 캔버스에 그려져 HTML에는 텍스트가 없다. 빈 페이지가 색인되지 않도록
       검색에서 제외한다. 공개 콘텐츠와 검색 유입은 leva.ai.kr이 전담한다.
       robots 메타는 검색 크롤러에만 적용되므로 광고 게재에는 영향이 없다. -->
  <meta name="robots" content="noindex" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Leva" />
  <meta property="og:title" content="Leva — 학습 로드맵" />
  <meta property="og:description" content="적응형 진단 결과에서 시작하는 맞춤 학습 로드맵과, 학습 맥락을 아는 AI 멘토." />
  <meta property="og:url" content="https://app.leva.ai.kr/" />
  <meta property="og:image" content="https://leva.ai.kr/assets/og-image.png" />
  <meta property="og:locale" content="ko_KR" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Leva">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Leva — 학습 로드맵</title>
  <link rel="manifest" href="manifest.json">

  <!-- 구글 애드센스. 퍼블리셔 ID는 공개 값이며 심사 크롤러가 <head>에서 찾아야 한다.
       ET13 fixture routes are a release-build evidence surface and must make no
       external request, so they fail closed before the script is created. -->
  <script>
    if (!new URLSearchParams(window.location.search).has('fixture')) {
      var adsenseScript = document.createElement('script');
      adsenseScript.async = true;
      adsenseScript.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2785578834914321';
      adsenseScript.crossOrigin = 'anonymous';
      document.head.appendChild(adsenseScript);
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <!-- Monaco is vendored and hash-locked by evidence/et13/assets.lock.json.
       Production and ET13 capture must never depend on a live CDN. -->
  <script src="vendor/monaco/vs/loader.js"></script>
  <script>
    require.config({ paths: { vs: 'vendor/monaco/vs' }});
    // F5-a/F5-c 반영: { dispose, layout, update } 핸들 반환 + Esc 포커스 탈출.
    // require가 비동기라 editor가 즉시 없을 수 있으므로 핸들은 클로저로 editor를 지연 참조.
    window.createDevpathEditor = function (container, code, runtime, onChange, onEscape, onReady) {
      var editor = null;
      var pendingCode = code;
      var pendingRuntime = runtime;
      var monacoReady = false;
      var disposed = false;
      var readySent = false;
      function monacoLanguage(value) {
        if (value === 'JAVA') return 'java';
        if (value === 'NODE') return 'javascript';
        if (value === 'PYTHON') return 'python';
        return null;
      }
      function renderPending() {
        if (!monacoReady || disposed) return;
        var language = monacoLanguage(pendingRuntime);
        if (language === null) {
          if (editor) { editor.dispose(); editor = null; }
          container.textContent = '';
          container.setAttribute('data-runtime-state', 'unsupported');
          return;
        }
        container.removeAttribute('data-runtime-state');
        if (!editor) {
          editor = monaco.editor.create(container, {
            value: pendingCode, language: language, theme: 'vs-dark',
            automaticLayout: true, minimap: { enabled: false }, fontSize: 14,
          });
          editor.onDidChangeModelContent(function () { onChange(editor.getValue()); });
          // F5-c DD7: Esc 시 Monaco 밖(dart sentinel)으로 포커스를 넘긴다.
          editor.addCommand(monaco.KeyCode.Escape, function () { onEscape(); });
          if (!readySent) { readySent = true; onReady(); }
          return;
        }
        if (editor.getValue() !== pendingCode) editor.setValue(pendingCode);
        monaco.editor.setModelLanguage(editor.getModel(), language);
      }
      require(['vs/editor/editor.main'], function () {
        monacoReady = true;
        renderPending();
      });
      return {
        dispose: function () {
          disposed = true;
          if (editor) { editor.dispose(); editor = null; }
        }, // F5-a
        layout:  function () { if (editor) editor.layout(); },  // F5-b
        update:  function (nextCode, nextRuntime) {
          pendingCode = nextCode;
          pendingRuntime = nextRuntime;
          renderPending();
        },
      };
    };

    // 애드센스 광고 단위 1개를 컨테이너에 삽입한다.
    // onResolved(status, height)는 정확히 1회만 호출된다('filled' | 'unfilled').
    // 자체 노출·클릭 추적은 붙이지 않는다(구글 정책).
    window.createDevpathAdUnit = function (container, slotId, onResolved) {
      var settled = false;
      var observer = null;
      var timer = null;
      var rafId = null;

      function settle(status, height) {
        if (settled) return;
        settled = true;
        if (observer) { observer.disconnect(); observer = null; }
        if (timer) { clearTimeout(timer); timer = null; }
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        onResolved(status, height);
      }

      var ins = document.createElement('ins');
      ins.className = 'adsbygoogle';
      ins.style.display = 'block';
      ins.style.width = '100%';
      ins.setAttribute('data-ad-client', 'ca-pub-2785578834914321');
      ins.setAttribute('data-ad-slot', slotId);
      ins.setAttribute('data-ad-format', 'auto');
      ins.setAttribute('data-full-width-responsive', 'true');
      container.appendChild(ins);

      // 채워짐 여부는 구글이 data-ad-status로 알려준다. 폴링이 아니라 관측한다.
      observer = new MutationObserver(function () {
        var status = ins.getAttribute('data-ad-status');
        if (status === 'filled') {
          settle('filled', ins.offsetHeight);
        } else if (status === 'unfilled') {
          settle('unfilled', 0);
        }
      });
      observer.observe(ins, { attributes: true, attributeFilter: ['data-ad-status'] });

      // 스크립트 미로드·애드블록·응답 없음을 모두 흡수하는 단일 마감선.
      // adsbygoogle 배열이 없다고 즉시 접으면 안 된다 — 스크립트가 async라
      // 로드 전에는 없는 것이 정상이고, `|| []` 큐가 바로 그 대기용이다.
      timer = setTimeout(function () { settle('unfilled', 0); }, 8000);

      // 폭 0인 채로 push하면 "No slot size for availableWidth=0"으로 거부된다.
      // 컨테이너가 실제로 레이아웃돼 폭을 가질 때까지 프레임을 기다린 뒤 push한다.
      function pushWhenMeasurable() {
        if (settled) return;
        if (container.offsetWidth > 0) {
          try {
            (window.adsbygoogle = window.adsbygoogle || []).push({});
          } catch (e) {
            settle('unfilled', 0);
          }
          return;
        }
        rafId = requestAnimationFrame(pushWhenMeasurable);
      }
      rafId = requestAnimationFrame(pushWhenMeasurable);

      return {
        dispose: function () {
          if (observer) { observer.disconnect(); observer = null; }
          if (timer) { clearTimeout(timer); timer = null; }
          if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
          if (ins.parentNode) { ins.parentNode.removeChild(ins); }
        },
      };
    };
  </script>
</body>
</html>
