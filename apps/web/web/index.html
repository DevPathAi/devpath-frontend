<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="devpath_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>devpath_web</title>
  <link rel="manifest" href="manifest.json">

  <!-- 구글 애드센스. 퍼블리셔 ID는 공개 값이며 심사 크롤러가 <head>에서 찾아야 한다. -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2785578834914321"
          crossorigin="anonymous"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"
          integrity="sha512-ZG31AN9z/CQD1YDDAK4RUAvogwbJHv6bHrumrnMLzdCrVu4HeAqrUX7Jsal/cbUwXGfaMUNmQU04tQ8XXl5Znw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs' }});
    // F5-a/F5-c 반영: { dispose, layout } 핸들 반환 + Esc 포커스 탈출.
    // require가 비동기라 editor가 즉시 없을 수 있으므로 핸들은 클로저로 editor를 지연 참조.
    window.createDevpathEditor = function (container, code, onChange, onEscape) {
      var editor = null;
      require(['vs/editor/editor.main'], function () {
        editor = monaco.editor.create(container, {
          value: code, language: 'dart', theme: 'vs-dark',
          automaticLayout: true, minimap: { enabled: false }, fontSize: 14,
        });
        editor.onDidChangeModelContent(function () { onChange(editor.getValue()); });
        // F5-c DD7: Esc 시 Monaco 밖(dart sentinel)으로 포커스를 넘긴다.
        editor.addCommand(monaco.KeyCode.Escape, function () { onEscape(); });
      });
      return {
        dispose: function () { if (editor) editor.dispose(); }, // F5-a
        layout:  function () { if (editor) editor.layout(); },  // F5-b
      };
    };

    // 애드센스 광고 단위 1개를 컨테이너에 삽입한다.
    // onResolved(status, height)는 정확히 1회만 호출된다('filled' | 'unfilled').
    // 자체 노출·클릭 추적은 붙이지 않는다(구글 정책).
    window.createDevpathAdUnit = function (container, slotId, onResolved) {
      var settled = false;
      var observer = null;
      var timer = null;
      var rafId = null;

      function settle(status, height) {
        if (settled) return;
        settled = true;
        if (observer) { observer.disconnect(); observer = null; }
        if (timer) { clearTimeout(timer); timer = null; }
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        onResolved(status, height);
      }

      var ins = document.createElement('ins');
      ins.className = 'adsbygoogle';
      ins.style.display = 'block';
      ins.style.width = '100%';
      ins.setAttribute('data-ad-client', 'ca-pub-2785578834914321');
      ins.setAttribute('data-ad-slot', slotId);
      ins.setAttribute('data-ad-format', 'auto');
      ins.setAttribute('data-full-width-responsive', 'true');
      container.appendChild(ins);

      // 채워짐 여부는 구글이 data-ad-status로 알려준다. 폴링이 아니라 관측한다.
      observer = new MutationObserver(function () {
        var status = ins.getAttribute('data-ad-status');
        if (status === 'filled') {
          settle('filled', ins.offsetHeight);
        } else if (status === 'unfilled') {
          settle('unfilled', 0);
        }
      });
      observer.observe(ins, { attributes: true, attributeFilter: ['data-ad-status'] });

      // 스크립트 미로드·애드블록·응답 없음을 모두 흡수하는 단일 마감선.
      // adsbygoogle 배열이 없다고 즉시 접으면 안 된다 — 스크립트가 async라
      // 로드 전에는 없는 것이 정상이고, `|| []` 큐가 바로 그 대기용이다.
      timer = setTimeout(function () { settle('unfilled', 0); }, 8000);

      // 폭 0인 채로 push하면 "No slot size for availableWidth=0"으로 거부된다.
      // 컨테이너가 실제로 레이아웃돼 폭을 가질 때까지 프레임을 기다린 뒤 push한다.
      function pushWhenMeasurable() {
        if (settled) return;
        if (container.offsetWidth > 0) {
          try {
            (window.adsbygoogle = window.adsbygoogle || []).push({});
          } catch (e) {
            settle('unfilled', 0);
          }
          return;
        }
        rafId = requestAnimationFrame(pushWhenMeasurable);
      }
      rafId = requestAnimationFrame(pushWhenMeasurable);

      return {
        dispose: function () {
          if (observer) { observer.disconnect(); observer = null; }
          if (timer) { clearTimeout(timer); timer = null; }
          if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
          if (ins.parentNode) { ins.parentNode.removeChild(ins); }
        },
      };
    };
  </script>
</body>
</html>
