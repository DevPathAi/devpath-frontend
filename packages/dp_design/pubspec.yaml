name: dp_design
description: Leva Material 3 design system with code-owned semantic tokens.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.1
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: ^4.2815.0   # 하한 가이드 — 설치 결과로 확정
  markdown_widget: ^2.3.2+8
  data_table_2: ^2.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # D2Coding 은 FontManifest(시작 시 로드)가 아니라 DpCodeFont 가 지연 로드한다.
  assets:
    - fonts/D2Coding.ttf
  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/Pretendard-Regular.otf
        - asset: fonts/Pretendard-Medium.otf
          weight: 500
        - asset: fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: fonts/Pretendard-Bold.otf
          weight: 700
