name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Activate melos
        run: dart pub global activate melos 7.0.0   # F2: 버전 핀(루트 dev_dependency ^7.0.0와 정렬, melos 8 출시 시 CI 깨짐 방지)
      - name: Bootstrap workspace
        run: melos bootstrap
      - name: Format check
        run: melos run format
      - name: Analyze
        run: melos run analyze
      - name: Test
        run: melos run test

  # ET1 contract proof only: build both compiled identities locally in CI.
  # Publishing, exact-digest promotion, deployment and rollback belong to ET10.
  web-image-config-contract:
    needs: analyze-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - identity: off
            enabled: 'false'
          - identity: on
            enabled: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/leva-web-${{ matrix.identity }}.tar
          build-args: |
            API_BASE_URL=https://api.contract.invalid
            USE_MOCK=false
            APP_VERSION=${{ github.sha }}
            MISSION_SPINE_ENABLED=${{ matrix.enabled }}
            ANALYTICS_CONTRACT_VERSION=mission-spine.analytics.v1
            ANALYTICS_ENVIRONMENT=production
          tags: ghcr.io/devpathai/devpath-web:${{ github.sha }}-mission-${{ matrix.identity }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable build identity
        shell: bash
        env:
          ARTIFACT_PATH: ${{ runner.temp }}/leva-web-${{ matrix.identity }}.tar
          MANIFEST_PATH: ${{ runner.temp }}/leva-web-${{ matrix.identity }}.manifest.json
          APP_VERSION: ${{ github.sha }}
          MISSION_SPINE_ENABLED: ${{ matrix.enabled }}
          ANALYTICS_CONTRACT_VERSION: mission-spine.analytics.v1
          ANALYTICS_ENVIRONMENT: production
          IDENTITY: ${{ matrix.identity }}
        run: |
          set -euo pipefail
          artifact_sha256="$(sha256sum "${ARTIFACT_PATH}" | awk '{print $1}')"
          printf '{"artifact":"leva-web-%s.tar","sha256":"%s","app_version":"%s","mission_spine_enabled":%s,"analytics_contract_version":"%s","analytics_environment":"%s"}\n' \
            "${IDENTITY}" "${artifact_sha256}" "${APP_VERSION}" \
            "${MISSION_SPINE_ENABLED}" "${ANALYTICS_CONTRACT_VERSION}" \
            "${ANALYTICS_ENVIRONMENT}" > "${MANIFEST_PATH}"
      - name: Preserve OFF/ON OCI artifact and manifest
        uses: actions/upload-artifact@v4
        with:
          name: leva-web-${{ github.sha }}-mission-${{ matrix.identity }}
          path: |
            ${{ runner.temp }}/leva-web-${{ matrix.identity }}.tar
            ${{ runner.temp }}/leva-web-${{ matrix.identity }}.manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  web-image:
    needs: analyze-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - identity: off
            enabled: 'false'
          - identity: on
            enabled: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: publish
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            API_BASE_URL=${{ vars.WEB_API_BASE_URL }}
            USE_MOCK=false
            APP_VERSION=${{ github.sha }}
            MISSION_SPINE_ENABLED=${{ matrix.enabled }}
            ANALYTICS_CONTRACT_VERSION=mission-spine.analytics.v1
            ANALYTICS_ENVIRONMENT=production
          tags: ghcr.io/devpathai/devpath-web:${{ github.sha }}-mission-${{ matrix.identity }}
          labels: |
            ai.leva.app_version=${{ github.sha }}
            ai.leva.mission_spine_enabled=${{ matrix.enabled }}
            ai.leva.analytics_contract_version=mission-spine.analytics.v1
            ai.leva.analytics_environment=production
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record safe registry digest evidence
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/leva-web-${{ matrix.identity }}.registry.json
          SOURCE_SHA: ${{ github.sha }}
          IDENTITY: ${{ matrix.identity }}
          MISSION_SPINE_ENABLED: ${{ matrix.enabled }}
          REGISTRY_DIGEST: ${{ steps.publish.outputs.digest }}
          ANALYTICS_CONTRACT_VERSION: mission-spine.analytics.v1
          ANALYTICS_ENVIRONMENT: production
        run: |
          set -euo pipefail
          test "${REGISTRY_DIGEST}" != ""
          test "${REGISTRY_DIGEST}" != "sha256:"
          test "${IDENTITY}" = "off" || test "${IDENTITY}" = "on"
          image_repository="ghcr.io/devpathai/devpath-web"
          image_tag="${SOURCE_SHA}-mission-${IDENTITY}"
          jq -n \
            --arg source_sha "${SOURCE_SHA}" \
            --arg image_repository "${image_repository}" \
            --arg image_tag "${image_tag}" \
            --arg image_digest "${REGISTRY_DIGEST}" \
            --arg app_version "${SOURCE_SHA}" \
            --argjson mission_spine_enabled "${MISSION_SPINE_ENABLED}" \
            --arg analytics_contract_version "${ANALYTICS_CONTRACT_VERSION}" \
            --arg analytics_environment "${ANALYTICS_ENVIRONMENT}" \
            '{
              "schema_version": "mission-spine.web-artifact.v1",
              "source_sha": $source_sha,
              "image_repository": $image_repository,
              "image_tag": $image_tag,
              "image_digest": $image_digest,
              "compiled_config": {
                "app_version": $app_version,
                "mission_spine_enabled": $mission_spine_enabled,
                "analytics_contract_version": $analytics_contract_version,
                "analytics_environment": $analytics_environment
              },
              "image_labels": {
                "ai.leva.app_version": $app_version,
                "ai.leva.mission_spine_enabled": ($mission_spine_enabled | tostring),
                "ai.leva.analytics_contract_version": $analytics_contract_version,
                "ai.leva.analytics_environment": $analytics_environment
              }
            }' > "${EVIDENCE_PATH}"
          jq -e '
            (keys | sort) == [
              "compiled_config", "image_digest", "image_labels",
              "image_repository", "image_tag", "schema_version", "source_sha"
            ] and
            (.compiled_config | keys | sort) == [
              "analytics_contract_version", "analytics_environment",
              "app_version", "mission_spine_enabled"
            ] and
            (.image_labels | keys | sort) == [
              "ai.leva.analytics_contract_version", "ai.leva.analytics_environment",
              "ai.leva.app_version", "ai.leva.mission_spine_enabled"
            ] and
            (.image_digest | test("^sha256:[0-9a-f]{64}$"))
          ' "${EVIDENCE_PATH}" >/dev/null
      - name: Preserve immutable registry evidence
        uses: actions/upload-artifact@v4
        with:
          name: leva-web-${{ github.sha }}-mission-${{ matrix.identity }}-registry-evidence
          path: ${{ runner.temp }}/leva-web-${{ matrix.identity }}.registry.json
          if-no-files-found: error
          retention-days: 30

  web-image-release-contract:
    needs: web-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download OFF/ON registry evidence
        uses: actions/download-artifact@v5
        with:
          pattern: leva-web-${{ github.sha }}-mission-*-registry-evidence
          path: evidence
          merge-multiple: true
      - name: Verify distinct immutable compiled identities
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          off_evidence="evidence/leva-web-off.registry.json"
          on_evidence="evidence/leva-web-on.registry.json"
          test -s "${off_evidence}"
          test -s "${on_evidence}"
          jq -e --arg sha "${SOURCE_SHA}" '
            .schema_version == "mission-spine.web-artifact.v1" and
            .source_sha == $sha and
            .image_repository == "ghcr.io/devpathai/devpath-web" and
            .image_tag == ($sha + "-mission-off") and
            .compiled_config.app_version == $sha and
            .compiled_config.mission_spine_enabled == false and
            .compiled_config.analytics_contract_version == "mission-spine.analytics.v1" and
            .compiled_config.analytics_environment == "production" and
            .image_labels["ai.leva.app_version"] == $sha and
            .image_labels["ai.leva.mission_spine_enabled"] == "false" and
            .image_labels["ai.leva.analytics_contract_version"] == "mission-spine.analytics.v1"
          ' "${off_evidence}" >/dev/null
          jq -e --arg sha "${SOURCE_SHA}" '
            .schema_version == "mission-spine.web-artifact.v1" and
            .source_sha == $sha and
            .image_repository == "ghcr.io/devpathai/devpath-web" and
            .image_tag == ($sha + "-mission-on") and
            .compiled_config.app_version == $sha and
            .compiled_config.mission_spine_enabled == true and
            .compiled_config.analytics_contract_version == "mission-spine.analytics.v1" and
            .compiled_config.analytics_environment == "production" and
            .image_labels["ai.leva.app_version"] == $sha and
            .image_labels["ai.leva.mission_spine_enabled"] == "true" and
            .image_labels["ai.leva.analytics_contract_version"] == "mission-spine.analytics.v1"
          ' "${on_evidence}" >/dev/null
          off_digest="$(jq -r '.image_digest' "${off_evidence}")"
          on_digest="$(jq -r '.image_digest' "${on_evidence}")"
          test "${off_digest}" != "${on_digest}"

  admin-image:
    needs: analyze-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          build-args: |
            API_BASE_URL=${{ vars.WEB_API_BASE_URL }}
            USE_MOCK=false
          tags: |
            ghcr.io/devpathai/devpath-admin:${{ github.sha }}
            ghcr.io/devpathai/devpath-admin:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  admin-deploy:
    needs: admin-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: DevPathAi
          repositories: devpath-gitops
      - uses: actions/checkout@v6
        with:
          repository: DevPathAi/devpath-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
      - name: Install kustomize
        run: |
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz && sudo mv kustomize /usr/local/bin/
      - name: set image to commit SHA
        working-directory: gitops/apps/devpath-admin/base
        run: kustomize edit set image ghcr.io/devpathai/devpath-admin=ghcr.io/devpathai/devpath-admin:${{ github.sha }}
      - name: commit & push
        working-directory: gitops
        run: |
          git config user.name "devpath-gitops-bot[bot]"
          git config user.email "devpath-gitops-bot[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "deploy(admin): ${{ github.sha }}"
          for i in 1 2 3; do git push && break || (git pull --rebase && sleep 2); done
