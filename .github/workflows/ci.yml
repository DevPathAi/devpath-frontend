name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Activate melos
        run: dart pub global activate melos 7.0.0   # F2: 버전 핀(루트 dev_dependency ^7.0.0와 정렬, melos 8 출시 시 CI 깨짐 방지)
      - name: Bootstrap workspace
        run: melos bootstrap
      - name: Format check
        run: melos run format
      - name: Analyze
        run: melos run analyze
      - name: Test
        run: melos run test

  # ET1 contract proof only: build both compiled identities locally in CI.
  # Publishing, exact-digest promotion, deployment and rollback belong to ET10.
  web-image-config-contract:
    needs: analyze-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - identity: off
            enabled: 'false'
          - identity: on
            enabled: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/leva-web-${{ matrix.identity }}.tar
          build-args: |
            API_BASE_URL=https://api.contract.invalid
            USE_MOCK=false
            APP_VERSION=${{ github.sha }}
            MISSION_SPINE_ENABLED=${{ matrix.enabled }}
            ANALYTICS_CONTRACT_VERSION=mission-spine.analytics.v1
            ANALYTICS_ENVIRONMENT=production
          tags: ghcr.io/devpathai/devpath-web:${{ github.sha }}-mission-${{ matrix.identity }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable build identity
        shell: bash
        env:
          ARTIFACT_PATH: ${{ runner.temp }}/leva-web-${{ matrix.identity }}.tar
          MANIFEST_PATH: ${{ runner.temp }}/leva-web-${{ matrix.identity }}.manifest.json
          APP_VERSION: ${{ github.sha }}
          MISSION_SPINE_ENABLED: ${{ matrix.enabled }}
          ANALYTICS_CONTRACT_VERSION: mission-spine.analytics.v1
          ANALYTICS_ENVIRONMENT: production
          IDENTITY: ${{ matrix.identity }}
        run: |
          set -euo pipefail
          artifact_sha256="$(sha256sum "${ARTIFACT_PATH}" | awk '{print $1}')"
          printf '{"artifact":"leva-web-%s.tar","sha256":"%s","app_version":"%s","mission_spine_enabled":%s,"analytics_contract_version":"%s","analytics_environment":"%s"}\n' \
            "${IDENTITY}" "${artifact_sha256}" "${APP_VERSION}" \
            "${MISSION_SPINE_ENABLED}" "${ANALYTICS_CONTRACT_VERSION}" \
            "${ANALYTICS_ENVIRONMENT}" > "${MANIFEST_PATH}"
      - name: Preserve OFF/ON OCI artifact and manifest
        uses: actions/upload-artifact@v4
        with:
          name: leva-web-${{ github.sha }}-mission-${{ matrix.identity }}
          path: |
            ${{ runner.temp }}/leva-web-${{ matrix.identity }}.tar
            ${{ runner.temp }}/leva-web-${{ matrix.identity }}.manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  web-image:
    needs: analyze-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            API_BASE_URL=${{ vars.WEB_API_BASE_URL }}
            USE_MOCK=false
            APP_VERSION=${{ github.sha }}
            MISSION_SPINE_ENABLED=false
            ANALYTICS_CONTRACT_VERSION=mission-spine.analytics.v1
            ANALYTICS_ENVIRONMENT=production
          tags: |
            ghcr.io/devpathai/devpath-web:${{ github.sha }}
            ghcr.io/devpathai/devpath-web:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-deploy:
    needs: web-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: DevPathAi
          repositories: devpath-gitops
      - uses: actions/checkout@v6
        with:
          repository: DevPathAi/devpath-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
      - name: Install kustomize
        run: |
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz && sudo mv kustomize /usr/local/bin/
      - name: set image to commit SHA
        working-directory: gitops/apps/devpath-web/base
        run: kustomize edit set image ghcr.io/devpathai/devpath-web=ghcr.io/devpathai/devpath-web:${{ github.sha }}
      - name: commit & push
        working-directory: gitops
        run: |
          git config user.name "devpath-gitops-bot[bot]"
          git config user.email "devpath-gitops-bot[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "deploy(web): ${{ github.sha }}"
          for i in 1 2 3; do git push && break || (git pull --rebase && sleep 2); done

  admin-image:
    needs: analyze-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          build-args: |
            API_BASE_URL=${{ vars.WEB_API_BASE_URL }}
            USE_MOCK=false
          tags: |
            ghcr.io/devpathai/devpath-admin:${{ github.sha }}
            ghcr.io/devpathai/devpath-admin:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  admin-deploy:
    needs: admin-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: DevPathAi
          repositories: devpath-gitops
      - uses: actions/checkout@v6
        with:
          repository: DevPathAi/devpath-gitops
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
      - name: Install kustomize
        run: |
          curl -sLo kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf kustomize.tar.gz && sudo mv kustomize /usr/local/bin/
      - name: set image to commit SHA
        working-directory: gitops/apps/devpath-admin/base
        run: kustomize edit set image ghcr.io/devpathai/devpath-admin=ghcr.io/devpathai/devpath-admin:${{ github.sha }}
      - name: commit & push
        working-directory: gitops
        run: |
          git config user.name "devpath-gitops-bot[bot]"
          git config user.email "devpath-gitops-bot[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "deploy(admin): ${{ github.sha }}"
          for i in 1 2 3; do git push && break || (git pull --rebase && sleep 2); done
