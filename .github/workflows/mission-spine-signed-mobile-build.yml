name: Mission Spine Signed Android Build

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Immutable release identifier bound into signed build provenance
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: mission-spine-signed-android-${{ inputs.release_id }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sign-android:
    if: github.ref == 'refs/heads/main'
    name: Sign Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: mission-spine-mobile-signing-android
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Authenticate protected Android approval
        id: approval
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1 || {
            echo 'protected approvals require attempt 1 and a fresh workflow_dispatch' >&2
            exit 1
          }
          node tools/mission_spine_protected_approval.mjs \
            --workflow-path=.github/workflows/mission-spine-signed-mobile-build.yml \
            --environment=mission-spine-mobile-signing-android \
            --job-name='Sign Android release' \
            --output="${RUNNER_TEMP}/android-approval.json"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.1'
          cache: true

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17.0.20+8'

      - name: Verify exact Android source and toolchain
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          test "${GITHUB_REPOSITORY}" = DevPathAi/devpath-frontend
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          flutter --version --machine \
            | grep -Fq '"frameworkVersion": "3.44.1"'
          flutter --version --machine \
            | grep -Fq '"frameworkRevision": "924134a44c189315be2148659913dda1671cbe99"'
          flutter --version --machine \
            | grep -Fq '"dartSdkVersion": "3.12.1"'
          java -version 2>&1 \
            | grep -Fqx 'OpenJDK Runtime Environment Temurin-17.0.20+8 (build 17.0.20+8)'
          test -f "${ANDROID_HOME}/platforms/android-36/android.jar"
          printf '%s  %s\n' \
            '${{ steps.approval.outputs.workflow_sha256 }}' \
            .github/workflows/mission-spine-signed-mobile-build.yml \
            | sha256sum --check --strict

      - name: Resolve exact locked workspace
        run: flutter pub get --enforce-lockfile

      - name: Build production Android release without mock transport
        working-directory: apps/mobile
        run: >-
          flutter build apk --release --no-pub
          --dart-define=USE_MOCK=false
          --dart-define=API_BASE_URL=https://api.leva.ai.kr
          --dart-define=WEB_APP_URL=https://app.leva.ai.kr

      - name: Sign and inspect org-controlled Android release-test APK
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          WORKFLOW_SHA256: ${{ steps.approval.outputs.workflow_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          for value in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_KEYSTORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD; do
            test -n "${!value:-}" || {
              echo "required protected signing secret ${value} is absent" >&2
              exit 1
            }
          done

          unsigned=apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          test -f "${unsigned}"
          keystore="${RUNNER_TEMP}/mission-spine-release-test.keystore"
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" \
            | base64 --decode > "${keystore}"
          test -s "${keystore}"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          apkanalyzer="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name apkanalyzer -print | sort | tail -1)"
          test -x "${apksigner}"
          test -x "${apkanalyzer}"
          if "${apksigner}" verify "${unsigned}" >/dev/null 2>&1; then
            echo 'Flutter build input must be unsigned before org-keystore signing' >&2
            exit 1
          fi

          stage="${RUNNER_TEMP}/signed-mobile-android"
          test ! -e "${stage}"
          mkdir -p "${stage}/mobile/android"
          signed="${stage}/mobile/android/leva-release.apk"
          "${apksigner}" sign \
            --v4-signing-enabled false \
            --ks "${keystore}" \
            --ks-key-alias "${ANDROID_RELEASE_KEY_ALIAS}" \
            --ks-pass env:ANDROID_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_RELEASE_KEY_PASSWORD \
            --out "${signed}" \
            "${unsigned}"
          test ! -e "${signed}.idsig"
          verify_output="$(${apksigner} verify --verbose --print-certs "${signed}")"
          printf '%s\n' "${verify_output}"
          cert_sha="$(printf '%s\n' "${verify_output}" \
            | dart run apps/mobile/tools/apksigner_certificate_parser.dart)"
          [[ "${cert_sha}" =~ ^[0-9a-f]{64}$ ]]

          application_id="$(${apkanalyzer} manifest application-id "${signed}")"
          version_name="$(${apkanalyzer} manifest version-name "${signed}")"
          version_code="$(${apkanalyzer} manifest version-code "${signed}")"
          source_version="$(sed -n 's/^version: //p' apps/mobile/pubspec.yaml)"
          expected_version_name="${source_version%%+*}"
          expected_version_code="${source_version##*+}"
          test "${application_id}" = ai.devpath.devpath_mobile
          test "${version_name}" = "${expected_version_name}"
          test "${version_code}" = "${expected_version_code}"
          [[ "${version_code}" =~ ^[1-9][0-9]*$ ]]

          jq -n \
            --arg workflow_sha256 "${WORKFLOW_SHA256}" \
            --arg application_id "${application_id}" \
            --arg version_name "${version_name}" \
            --argjson version_code "${version_code}" \
            --arg signing_certificate_sha256 "${cert_sha}" \
            --slurpfile approval "${RUNNER_TEMP}/android-approval.json" \
            '{
              workflow_sha256: $workflow_sha256,
              application_id: $application_id,
              version_name: $version_name,
              version_code: $version_code,
              signature_verified: true,
              signing_certificate_sha256: $signing_certificate_sha256,
              approval: {
                approval_environment: $approval[0].approval_environment,
                approval_environment_id: $approval[0].approval_environment_id,
                approval_job_name: $approval[0].approval_job_name,
                approved_by: $approval[0].approved_by,
                approved_by_id: $approval[0].approved_by_id,
                approval_effective_at: $approval[0].approval_effective_at
              }
            }' > "${stage}/android-metadata.json"
          rm -f -- "${keystore}"

      - name: Preserve unsealable Android signing input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.release_id }}-signed-android-input-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-mobile-android
          if-no-files-found: error
          overwrite: false
          retention-days: 3

      - name: Remove ephemeral Android signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "${RUNNER_TEMP}/mission-spine-release-test.keystore"

  publish-bundle:
    name: Publish signed Android bundle
    needs: sign-android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Reject rerun approval reuse and verify source
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1 || {
            echo 'protected approvals require attempt 1 and a fresh workflow_dispatch' >&2
            exit 1
          }
          [[ "${RELEASE_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          test "${GITHUB_REPOSITORY}" = DevPathAi/devpath-frontend
          test "${GITHUB_REF}" = refs/heads/main
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Download exact Android signing input
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ inputs.release_id }}-signed-android-input-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: build/mission-spine/signed-input/android

      - name: Assemble and validate exact two-file signed Android bundle
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          android_root=build/mission-spine/signed-input/android
          test -z "$(find "${android_root}" -type l -print -quit)"
          test -z "$(find "${android_root}" -mindepth 1 ! -type f ! -type d -print -quit)"
          test "$(find "${android_root}" -type f | wc -l)" = 2
          test -f "${android_root}/mobile/android/leva-release.apk"
          test -f "${android_root}/android-metadata.json"
          workflow_sha="$(jq -er '.workflow_sha256' "${android_root}/android-metadata.json")"
          printf '%s  %s\n' \
            "${workflow_sha}" \
            .github/workflows/mission-spine-signed-mobile-build.yml \
            | sha256sum --check --strict

          stage=build/mission-spine/signed-bundle
          test ! -e "${stage}"
          mkdir -p "${stage}/mobile/android"
          cp "${android_root}/mobile/android/leva-release.apk" \
            "${stage}/mobile/android/leva-release.apk"
          node tools/mission_spine_release_evidence.mjs signed-provenance \
            --release-id="${RELEASE_ID}" \
            --source-sha="${GITHUB_SHA}" \
            --workflow-sha256="${workflow_sha}" \
            --producer-run-id="${GITHUB_RUN_ID}" \
            --producer-run-attempt="${GITHUB_RUN_ATTEMPT}" \
            --pubspec-lock=pubspec.lock \
            --apk="${stage}/mobile/android/leva-release.apk" \
            --android-metadata="${android_root}/android-metadata.json" \
            --output="${stage}/build-provenance.v2.json"
          lock_sha="$(sha256sum pubspec.lock | cut -d' ' -f1)"
          node tools/mission_spine_release_evidence.mjs validate-signed-bundle \
            --root="${stage}" \
            --release-id="${RELEASE_ID}" \
            --source-sha="${GITHUB_SHA}" \
            --workflow-sha256="${workflow_sha}" \
            --producer-run-id="${GITHUB_RUN_ID}" \
            --producer-run-attempt="${GITHUB_RUN_ATTEMPT}" \
            --pubspec-lock-sha256="${lock_sha}"

      - name: Publish exact signed Android bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.release_id }}-signed-android-build-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: build/mission-spine/signed-bundle
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  dispatch-signed-mobile:
    if: github.ref == 'refs/heads/chore/prod26r9-signed-mobile-dispatch'
    name: Dispatch signed Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      RELEASE_ID: ms-20260830-prod26r9
      SOURCE_SHA: edc2c56f695eaad6d5e494bab81d5b5db4427e14
      INPUT_RELEASE_ID: ${{ inputs.release_id }}
      GITHUB_API_VERSION: "2026-03-10"
    steps:
      - name: Prove the exact one-shot dispatcher context
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = "VelkaressiaBlutkrone"
          test "$GITHUB_TRIGGERING_ACTOR" = "VelkaressiaBlutkrone"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_REF" = "refs/heads/chore/prod26r9-signed-mobile-dispatch"
          test "$INPUT_RELEASE_ID" = "$RELEASE_ID"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Dispatch main through the repository Actions App
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(
            gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha'
          )"
          test "$current_main" = "$SOURCE_SHA"

          payload="$RUNNER_TEMP/prod26r9-signed-mobile-dispatch.json"
          response="$RUNNER_TEMP/prod26r9-signed-mobile-dispatch-response.json"
          run_document="$RUNNER_TEMP/prod26r9-signed-mobile-run.json"
          test ! -e "$payload"
          test ! -e "$response"
          test ! -e "$run_document"
          umask 077
          jq -n \
            --arg release_id "$RELEASE_ID" \
            '{
              "ref": "main",
              "inputs": {"release_id": $release_id}
            }' >"$payload"

          gh api --method POST \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            --input "$payload" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/mission-spine-signed-mobile-build.yml/dispatches" \
            >"$response"
          inner_run_id="$(jq -er '.workflow_run_id | select(type == "number" and . > 0)' "$response")"
          [[ "$inner_run_id" =~ ^[1-9][0-9]*$ ]]

          cancel_inner() {
            gh api --method POST \
              -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$inner_run_id/cancel" \
              >/dev/null 2>&1 || true
          }
          trap 'status=$?; if test "$status" -ne 0; then cancel_inner; fi; exit "$status"' EXIT

          for attempt in $(seq 1 12); do
            if gh api -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$inner_run_id" \
              >"$run_document"; then
              break
            fi
            test "$attempt" -lt 12
            sleep 1
          done

          inner_actor="$(jq -er '.actor.login' "$run_document")"
          inner_triggering_actor="$(jq -er '.triggering_actor.login' "$run_document")"
          test "$inner_actor" = "github-actions[bot]"
          test "$inner_triggering_actor" = "github-actions[bot]"
          test "$(jq -er '.event' "$run_document")" = "workflow_dispatch"
          test "$(jq -er '.head_branch' "$run_document")" = "main"
          test "$(jq -er '.head_sha' "$run_document")" = "$SOURCE_SHA"
          test "$(jq -er '.run_attempt' "$run_document")" = "1"
          test "$(jq -er '.path' "$run_document")" = ".github/workflows/mission-spine-signed-mobile-build.yml"
          test "$(jq -r '.conclusion' "$run_document")" = "null"
          trap - EXIT

          {
            echo "### Independent signed Android dispatch"
            echo "- inner run: $inner_run_id"
            echo "- actor: $inner_actor"
            echo "- triggering actor: $inner_triggering_actor"
            echo "- source SHA: $SOURCE_SHA"
          } >>"$GITHUB_STEP_SUMMARY"
