---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20260916-community-ia

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch release-ready ET13 evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/et13-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260916-community-ia",
              "candidate_run_id": "35100929597",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "10448496032",
              "candidate_spec_sha256": "a60c112f66cea0217757488c913700c1a323217ba8bc7c4ad28084335de9b93c",
              "baseline_run_id": "35099749034",
              "baseline_run_attempt": "1",
              "baseline_artifact_id": "10446964240"
            }
          }
          JSON

      - name: Dispatch manual AT evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-manual-at-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260916-community-ia",
              "candidate_run_id": "35100929597",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "10448496032",
              "candidate_spec_sha256": "a60c112f66cea0217757488c913700c1a323217ba8bc7c4ad28084335de9b93c"
            }
          }
          JSON
