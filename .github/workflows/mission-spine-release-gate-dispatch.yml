---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20260930-s3-web-redesign-r2

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch ET13 baseline approval as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/et13-baseline-approval.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260930-s3-web-redesign-r2",
              "raw_run_id": "36679809381",
              "raw_run_attempt": "1",
              "raw_artifact_id": "11081638267",
              "raw_artifact_digest": "sha256:198664131458b70ae33213eedf9989afa39e7bbded84a30960a0339fd9901155",
              "raw_workflow_sha256": "71ba5845635677793d97d1b30d01a7ad58fed2e8ca2e2e9cc1a437f89b7d323e"
            }
          }
          JSON
