---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20260930-s3-web-redesign

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch release-ready ET13 evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/et13-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260930-s3-web-redesign",
              "candidate_run_id": "36689157907",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "11084409800",
              "candidate_spec_sha256": "4397add36ce5b6ff883f648ec7396de1c2760c06c692327adcdc716588149212",
              "baseline_run_id": "36687549326",
              "baseline_run_attempt": "1",
              "baseline_artifact_id": "11084342255"
            }
          }
          JSON

      - name: Dispatch manual AT evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-manual-at-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260930-s3-web-redesign",
              "candidate_run_id": "36689157907",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "11084409800",
              "candidate_spec_sha256": "4397add36ce5b6ff883f648ec7396de1c2760c06c692327adcdc716588149212"
            }
          }
          JSON
