---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20260920-community-flat-pages

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch release-ready ET13 evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/et13-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260920-community-flat-pages",
              "candidate_run_id": "35504481794",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "10603192764",
              "candidate_spec_sha256": "e12921324ea5a1e325bb8125631aba7a653375d49ad46c5c91ec7031cf2640a7",
              "baseline_run_id": "35495107534",
              "baseline_run_attempt": "1",
              "baseline_artifact_id": "10600418949"
            }
          }
          JSON

      - name: Dispatch manual AT evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-manual-at-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260920-community-flat-pages",
              "candidate_run_id": "35504481794",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "10603192764",
              "candidate_spec_sha256": "e12921324ea5a1e325bb8125631aba7a653375d49ad46c5c91ec7031cf2640a7"
            }
          }
          JSON
