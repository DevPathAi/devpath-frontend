---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20261016-leva-inspection-fixes

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch release-ready ET13 evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/et13-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20261016-leva-inspection-fixes",
              "candidate_run_id": "38830187106",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "12017121352",
              "candidate_spec_sha256": "a0d56c1033acae239605678a9d6af0c45b82832c65d95f90d84018f61871df7c",
              "baseline_run_id": "38827825106",
              "baseline_run_attempt": "1",
              "baseline_artifact_id": "12016586488"
            }
          }
          JSON

      - name: Dispatch manual AT evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-manual-at-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20261016-leva-inspection-fixes",
              "candidate_run_id": "38830187106",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "12017121352",
              "candidate_spec_sha256": "a0d56c1033acae239605678a9d6af0c45b82832c65d95f90d84018f61871df7c"
            }
          }
          JSON
