---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20260930-s3-web-redesign-r2

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch release-ready ET13 evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/et13-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260930-s3-web-redesign-r2",
              "candidate_run_id": "36700882757",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "11090285223",
              "candidate_spec_sha256": "e31285ed135a65466c63b3777b703263ae61ad4d9ac2f2a1c4a1d376d1c17aef",
              "baseline_run_id": "36700165396",
              "baseline_run_attempt": "1",
              "baseline_artifact_id": "11089103601"
            }
          }
          JSON

      - name: Dispatch manual AT evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-manual-at-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260930-s3-web-redesign-r2",
              "candidate_run_id": "36700882757",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "11090285223",
              "candidate_spec_sha256": "e31285ed135a65466c63b3777b703263ae61ad4d9ac2f2a1c4a1d376d1c17aef"
            }
          }
          JSON
