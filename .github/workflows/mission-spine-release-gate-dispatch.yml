---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20260920-community-flat-pages-r2

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch release-ready ET13 evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/et13-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260920-community-flat-pages-r2",
              "candidate_run_id": "35551840448",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "10619025353",
              "candidate_spec_sha256": "7e9f80bfbddb37d9745ae5dafb2e0aa76d381c945cedfd53f2756e0cfd7b5ea9",
              "baseline_run_id": "35551443095",
              "baseline_run_attempt": "1",
              "baseline_artifact_id": "10618243140"
            }
          }
          JSON

      - name: Dispatch manual AT evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-manual-at-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260920-community-flat-pages-r2",
              "candidate_run_id": "35551840448",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "10619025353",
              "candidate_spec_sha256": "7e9f80bfbddb37d9745ae5dafb2e0aa76d381c945cedfd53f2756e0cfd7b5ea9"
            }
          }
          JSON
