---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20261002-ai-provider-fallback-gpu7b

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch ET13 baseline approval as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/et13-baseline-approval.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20261002-ai-provider-fallback-gpu7b",
              "raw_run_id": "36918293674",
              "raw_run_attempt": "1",
              "raw_artifact_id": "11191407144",
              "raw_artifact_digest": "sha256:09b692cce43e1649eaaae07286d6119b420dd5656a20e012d9e0e8a2b3a99355",
              "raw_workflow_sha256": "71ba5845635677793d97d1b30d01a7ad58fed2e8ca2e2e9cc1a437f89b7d323e"
            }
          }
          JSON
