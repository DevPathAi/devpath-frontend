---
name: Mission Spine Release Gate Dispatch

'on':
  push:
    branches:
      - automation/dispatch-ms-20260920-community-flat-pages-r3

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch protected release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch release-ready ET13 evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/et13-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260920-community-flat-pages-r3",
              "candidate_run_id": "35573090295",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "10627021263",
              "candidate_spec_sha256": "b5ede99fa46a753202d9a4da1218c6fb9de1e7f0516063211648a4fd4c84cbcd",
              "baseline_run_id": "35572702300",
              "baseline_run_attempt": "1",
              "baseline_artifact_id": "10627065495"
            }
          }
          JSON

      - name: Dispatch manual AT evidence as GitHub Actions automation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/mission-spine-manual-at-evidence.yml/dispatches" \
            --input - <<'JSON'
          {
            "ref": "main",
            "inputs": {
              "release_id": "ms-20260920-community-flat-pages-r3",
              "candidate_run_id": "35573090295",
              "candidate_run_attempt": "1",
              "candidate_artifact_id": "10627021263",
              "candidate_spec_sha256": "b5ede99fa46a753202d9a4da1218c6fb9de1e7f0516063211648a4fd4c84cbcd"
            }
          }
          JSON
